name: Daily Static Export & GitHub Pages Deploy
on:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weborg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: bash -n plesk_daily_cron.sh
      - run: php -l index.php
      - run: php tests/http_transport.php
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  export-and-deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run Single-File Static HTML Exporter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php index.php --export

      - name: Commit & Push Updated Static index.html
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "auto: Daily static index.html export [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Stage Static Pages Files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
